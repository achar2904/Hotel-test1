<div id="screen-login" class="login-shell">
  <div class="login-card">
    <div class="login-mark" aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center;">
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-3"/>
        <path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"/>
      </svg>
    </div>
    <h1 class="login-title" data-i18n="login.title">ระบบแจ้งเคสภายในโรงแรม</h1>
    <p class="login-sub">The Regent Cha-am Beach Resort & VALA</p>
    <form id="login-form" onsubmit="App.handleLogin(event)" style="margin-top:20px; text-align:left;">
      <div class="form-field">
        <label class="form-label" for="login-username">ชื่อผู้ใช้ หรือ อีเมล</label>
        <input class="form-input" id="login-username" required placeholder="admin หรือ อีเมลพนักงาน" autocomplete="username">
      </div>
      <div class="form-field">
        <label class="form-label" for="login-password">รหัสผ่าน</label>
        <input class="form-input" id="login-password" type="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-full mt-2" style="justify-content:center;">
        <span>เข้าสู่ระบบ</span>
      </button>
    </form>

    <div style="margin-top:24px; padding-top:16px; border-top:1px dashed var(--border-hairline); font-size:0.8rem; color:var(--text-muted);">
      <div>💡 <strong>บัญชีเริ่มต้นของผู้ดูแลระบบ (Admin):</strong></div>
      <div style="font-family:var(--font-mono); margin-top:4px;">Username: <strong>admin</strong> | Password: <strong>admin123</strong></div>
    </div>
  </div>
</div>
