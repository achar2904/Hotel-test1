<section id="view-detail" class="view hidden">
        <button class="btn-ghost" onclick="App.go('list')">
          <span aria-hidden="true">←</span> <span data-i18n="detail.back">กลับรายการเคส</span>
        </button>
        <div class="detail-hero mt-2">
          <div class="page-header" style="margin-bottom:8px;">
            <div class="page-title">
              <span class="case-no t-caption-bold" id="detail-no">—</span>
              <h1 class="t-section" id="detail-subject">—</h1>
            </div>
            <div class="action-buttons" id="detail-actions"></div>
          </div>
          <div class="row gap-2" id="detail-quickmeta"></div>
        </div>

        <div class="detail-grid mt-4">
          <div class="stack gap-3">
            <div class="card">
              <h3 class="t-feature mb-3" data-i18n="detail.conversation">บทสนทนา</h3>
              <div class="timeline" id="detail-timeline"></div>
              <div class="reply-composer">
                <button class="btn-icon reply-attach" onclick="document.getElementById('reply-file').click()" aria-label="Attach file">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <input type="file" id="reply-file" accept="image/*" class="hidden" onchange="App.attachToReply(this.files[0])">
                <input class="form-input" id="reply-input" placeholder="พิมพ์ข้อความ..." data-i18n-placeholder="detail.replyPlaceholder" onkeydown="if(event.key==='Enter') App.sendReply()">
                <button class="btn-circle" aria-label="Send" onclick="App.sendReply()">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
              </div>
              <div id="pending-attach" class="text-muted t-small mt-2"></div>
            </div>
          </div>

          <aside class="detail-side">
            <div class="card">
              <h3 class="t-feature mb-3" data-i18n="detail.info">รายละเอียด</h3>
              <div id="detail-info"></div>
            </div>
            <div class="card">
              <h3 class="t-feature mb-3" data-i18n="detail.sla">SLA</h3>
              <div id="detail-sla"></div>
            </div>
          </aside>
        </div>
      </section>
