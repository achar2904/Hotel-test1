<!-- ================= MODAL BACKDROP ================= -->
<div id="modal-backdrop" class="modal-backdrop" onclick="if(event.target===this) App.closeModal()">
  <div class="modal" role="dialog" aria-modal="true" id="modal" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 class="modal-title" id="modal-title">—</h2>
      <button class="btn-icon" onclick="App.closeModal()" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>
